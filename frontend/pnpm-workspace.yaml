# pnpm 11 将构建脚本配置从 package.json 迁移到此文件。
# 允许 esbuild/vue-demi 等包的 postinstall 构建脚本运行。
dangerouslyAllowAllBuilds: true

# pnpm 10+ 将 overrides 从 package.json 的 pnpm 字段迁到 workspace 配置。
overrides:
  js-cookie: 3.0.7
  form-data@<4.0.6: ">=4.0.6"
  postcss@<8.5.18: ">=8.5.18"
  dompurify@<3.4.17: ">=3.4.17"
  source-map-js@<1.2.2: ">=1.2.2"
  follow-redirects@<1.16.2: ">=1.16.2"
  decode-uri-component@<0.5.1: ">=0.5.1"
