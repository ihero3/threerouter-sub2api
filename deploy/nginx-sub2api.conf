# =============================================================================
# Sub2API Nginx Reverse Proxy Configuration
# Sub2API Nginx 反向代理配置
#
# Installation:
#   sudo cp nginx-sub2api.conf /etc/nginx/sites-available/sub2api
#   sudo ln -s /etc/nginx/sites-available/sub2api /etc/nginx/sites-enabled/sub2api
#   sudo rm -f /etc/nginx/sites-enabled/default  # Remove default site
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace SERVER_PORT with your backend port (default: 8080)
# Replace YOUR_DOMAIN with your domain name (or use _ for all domains)
# =============================================================================

# Upstream definition
upstream sub2api_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=sub2api_api:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=sub2api_static:10m rate=200r/s;
limit_conn_zone $binary_remote_addr zone=sub2api_conn:10m;

server {
    listen 80;
    # Replace _ with your domain: server_name api.example.com;
    server_name _;

    # Max request body size (must match backend gateway.max_body_size)
    client_max_body_size 256m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # -------------------------------------------------------------------------
    # API routes - proxy to backend with rate limiting
    # -------------------------------------------------------------------------
    location ~ ^/(api|v1|v1beta|backend-api|antigravity|setup|health|responses|images)/ {
        limit_req zone=sub2api_api burst=200 nodelay;
        # 单 IP 并发连接上限：AI 客户端（codex 等）常从同一出口 IP 并行发起多路
        # tool 调用，20 过于紧张会返回 503。50 兼顾单 IP 滥用防护与正常多路并发。
        limit_conn sub2api_conn 50;

        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running AI requests (streaming)
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
    }

    # -------------------------------------------------------------------------
    # Sora media proxy
    # -------------------------------------------------------------------------
    location /sora/media/ {
        limit_req zone=sub2api_api burst=50 nodelay;

        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # -------------------------------------------------------------------------
    # Static assets cache
    # -------------------------------------------------------------------------
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        limit_req zone=sub2api_static burst=500 nodelay;

        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache static assets at Nginx level
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # -------------------------------------------------------------------------
    # Main application (SPA fallback to backend)
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=sub2api_api burst=100 nodelay;
        limit_conn sub2api_conn 50;

        proxy_pass http://sub2api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # -------------------------------------------------------------------------
    # Let's Encrypt ACME challenge (must be before location /)
    # -------------------------------------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Health check (no rate limit, no access log)
    # -------------------------------------------------------------------------
    location = /health {
        proxy_pass http://sub2api_backend;
        access_log off;
    }

    # -------------------------------------------------------------------------
    # Block sensitive paths
    # -------------------------------------------------------------------------
    location ~ /\.(git|env|config) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
